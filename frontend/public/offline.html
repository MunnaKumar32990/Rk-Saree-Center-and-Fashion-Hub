<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>You're offline — RK Saree Center</title>
    <style>
      body {
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
        display: flex;
        min-height: 100vh;
        align-items: center;
        justify-content: center;
        margin: 0;
        padding: 2rem;
        background: #fafaf9;
        color: #1c1917;
        text-align: center;
      }
      main { max-width: 26rem; }
      h1 { font-size: 1.5rem; margin: 0 0 0.75rem; color: #0f766e; }
      p { color: #57534e; line-height: 1.6; margin: 0 0 1.25rem; }
      button {
        padding: 0.85rem 1.75rem;
        border-radius: 0.75rem;
        border: 0;
        background: #0f766e;
        color: #fff;
        font-size: 1rem;
        font-weight: 600;
        min-height: 48px;
        cursor: pointer;
      }
      button:focus-visible { outline: 3px solid #5eead4; outline-offset: 2px; }
    </style>
  </head>
  <body>
    <main>
      <h1>You're offline</h1>
      <p>
        We can't reach the store right now. Check your connection and try again —
        anything already in your cart is saved.
      </p>
      <button type="button" onclick="window.location.reload()">Try again</button>
    </main>
  </body>
</html>
